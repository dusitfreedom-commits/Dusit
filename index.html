    function calcDistance(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * (Math.PI / 180);
      const dLon = (lon2 - lon1) * (Math.PI / 180);
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * (Math.PI / 180)) * Math.cos(lat2 * (Math.PI / 180)) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
      return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
    }

    function App() {
      // --- AUTHENTICATION STATE ---
      const [currentUser, setCurrentUser] = useState(() => getStored('auth_user', null));
      const [loginInput, setLoginInput] = useState({ username: '', password: '' });
      const [loginError, setLoginError] = useState('');

      // --- MAIN MODULES & DROPDOWN NAV STATE ---
      const [currentModule, setCurrentModule] = useState('dashboard');
      const [isNavDropdownOpen, setIsNavDropdownOpen] = useState(false);

      // --- CORE MASTER DATA STATE ---
      const [depot, setDepot] = useState(() => getStored('depot', INITIAL_DEPOT));
      const [centralCustomers, setCentralCustomers] = useState(() => getStored('central_customers', INITIAL_CENTRAL_CUSTOMERS));
      const [vehicles, setVehicles] = useState(() => getStored('vehicles', INITIAL_FLEET));
      const [masterBoxes, setMasterBoxes] = useState(() => getStored('master_boxes', INITIAL_MASTER_BOXES));
      const [editingDepot, setEditingDepot] = useState(INITIAL_DEPOT);
      const [showDepotModal, setShowDepotModal] = useState(false);
      const [editingVehicle, setEditingVehicle] = useState(null);
      const [showVehicleModal, setShowVehicleModal] = useState(false);
      const [editingCustomer, setEditingCustomer] = useState(null);
      const [showCustomerModal, setShowCustomerModal] = useState(false);

      const totalVehiclesCount = useMemo(() => {
        return vehicles.reduce((sum, v) => sum + (v.quantity || 1), 0);
      }, [vehicles]);

      // --- MODULE 3: MASTER EXCEL BOX & TRUCK WEIGHT CALCULATOR (FRESH FROM EXCEL) ---
      const [masterProducts, setMasterProducts] = useState(() => getStored('master_products', MASTER_PRODUCTS));
      const [calcRows, setCalcRows] = useState(() => getStored('calc_rows', INITIAL_CALC_ROWS));
      const [calcSearchQuery, setCalcSearchQuery] = useState('');
      const [masterSearchQuery, setMasterSearchQuery] = useState('');
      const [showMasterModal, setShowMasterModal] = useState(false);
      const [showMasterEditModal, setShowMasterEditModal] = useState(false);
      const [editingMasterProduct, setEditingMasterProduct] = useState(null);
      const [showBatchImportModal, setShowBatchImportModal] = useState(false);
      const [batchInputText, setBatchInputText] = useState('');
      const [batchImportMode, setBatchImportMode] = useState('append');

      const [calcRates, setCalcRates] = useState(() => getStored('calc_rates', {
        rate4w: 1682,
        rate4wJ: 1800,
        rate6w: 6609,
        rate10w: 0
      }));

      // Exact Excel Summary Calculations for Module 3
      const calcSummary = useMemo(() => {
        let cartonS = 0;
        let cartonM = 0;
        let cartonL = 0;
        let totalQty = 0;
        let totalCbm = 0;
        let totalKg = 0;

        calcRows.forEach(r => {
          const q = r.qty || 0;
          const c = r.carton || 0;
          const size = (r.cartonSize || 'S').toUpperCase().trim();
          if (size === 'S') cartonS += c;
          else if (size === 'M') cartonM += c;
          else if (size === 'L') cartonL += c;
          else cartonS += c;

          totalQty += q;
          totalCbm += (r.totalCbm || 0);
          totalKg += (r.totalKg || 0);
        });

        const roundS = Math.ceil(cartonS);
        const roundM = Math.ceil(cartonM);
        const roundL = Math.ceil(cartonL);
        const totalCartons = roundS + roundM + roundL;

        const truck4w = (totalCbm > 0 || totalKg > 0) ? Math.ceil(Math.max(totalCbm / 6, totalKg / 1500)) : 0;
        const truck4wJ = (totalCbm > 0 || totalKg > 0) ? Math.ceil(Math.max(totalCbm / 10, totalKg / 3000)) : 0;
        const truck6w = (totalCbm > 0 || totalKg > 0) ? Math.ceil(Math.max(totalCbm / 40, totalKg / 5000)) : 0;

        const cost4w = truck4w * (calcRates.rate4w || 1682);
        const cost4wJ = truck4wJ * (calcRates.rate4wJ || 1800);
        const cost6w = truck6w * (calcRates.rate6w || 6609);

        let recommendation = 'ไม่มีรายการสินค้า';
        if (totalCbm > 0 || totalKg > 0) {
          if (cost4w <= Math.min(cost4wJ, cost6w)) {
            recommendation = `เลือก 4W (${truck4w} คัน)`;
          } else if (cost4wJ <= cost6w) {
            recommendation = `เลือก 4W J (${truck4wJ} คัน)`;
          } else {
            recommendation = `เลือก 6W (${truck6w} คัน)`;
          }
        }

        return {
          cartonS: roundS,
          cartonM: roundM,
          cartonL: roundL,
          totalCartons: totalCartons,
          totalQty: totalQty,
          totalCbm: totalCbm,
          totalKg: totalKg,
          truck4w: truck4w,
          truck4wJ: truck4wJ,
          truck6w: truck6w,
          cost4w: cost4w,
          cost4wJ: cost4wJ,
          cost6w: cost6w,
          recommendation: recommendation
        };

      const normalizeDateToISO = (dStr) => {
        if (!dStr || dStr === '-' || dStr === 'ไม่มี' || dStr === 'ยังไม่ระบุ') return null;
        const s = String(dStr).trim();
        
        // Case YYYY-MM-DD
        if (/^\d{4}-\d{1,2}-\d{1,2}$/.test(s)) {
          const parts = s.split('-');
          return parts[0] + '-' + parts[1].padStart(2, '0') + '-' + parts[2].padStart(2, '0');
        }
        
        // Case M/D/YYYY or D/M/YYYY
        if (/^\d{1,2}[\/\-\.]\d{1,2}[\/\-\.]\d{4}$/.test(s)) {
          const parts = s.split(/[\/\-\.]/);
          let p1 = parseInt(parts[0], 10);
          let p2 = parseInt(parts[1], 10);
          let y = parseInt(parts[2], 10);
          if (y < 2500 && y > 2400) y -= 543;
          
          let m = p1;
          let d = p2;
          if (p1 > 12 && p2 <= 12) {
            d = p1;
            m = p2;
          }
          return y + '-' + String(m).padStart(2, '0') + '-' + String(d).padStart(2, '0');
        }

        return s;
      };

      // Optimization Algorithm with Real-Road OSRM Driving Engine
      const handleOptimizeRoutes = async () => {
        if (dailyStops.length === 0) {
          alert('กรุณาเลือกจุดส่งในแผนประจำวันก่อนครับ');
          return;
        }

        setIsOptimizing(true);
        try {
          // 1. Sort stops by distance to depot / nearest neighbor order
          const sortedStops = [...dailyStops].sort((a, b) => {
            const distA = Math.hypot(a.lat - depot.lat, a.lng - depot.lng);
            const distB = Math.hypot(b.lat - depot.lat, b.lng - depot.lng);
            return distA - distB;
          });

          const numVehicles = Math.min(vehicles.length, Math.max(1, Math.ceil(sortedStops.length / 4)));
          const results = [];
          
          let stopIdx = 0;
          for (let v = 0; v < numVehicles; v++) {
            const veh = vehicles[v % vehicles.length];
            const chunkCount = Math.ceil((sortedStops.length - stopIdx) / (numVehicles - v));
            const vStops = sortedStops.slice(stopIdx, stopIdx + chunkCount);
            stopIdx += chunkCount;

            if (vStops.length === 0) continue;

            // Build coordinates string for OSRM: lng,lat;lng,lat;...
            const coordsList = [
              [depot.lng, depot.lat],
              ...vStops.map(s => [s.lng, s.lat]),
              [depot.lng, depot.lat]
            ];
            const coordsStr = coordsList.map(c => c[0] + ',' + c[1]).join(';');

            let roadCoords = null;
            let realDistance = parseFloat((vStops.length * 15.2 + 22.0).toFixed(1));
            let realDuration = Math.round(realDistance * 2.3 * trafficFactor);

            try {
              const osrmUrl = 'https://router.project-osrm.org/route/v1/driving/' + coordsStr + '?overview=full&geometries=geojson';
              const resp = await fetch(osrmUrl);
              if (resp.ok) {
                const data = await resp.json();
                if (data.code === 'Ok' && data.routes && data.routes[0]) {
                  const r = data.routes[0];
                  // OSRM coordinates are [lng, lat], Leaflet requires [lat, lng]
                  roadCoords = r.geometry.coordinates.map(pt => [pt[1], pt[0]]);
                  realDistance = parseFloat((r.distance / 1000).toFixed(1));
                  realDuration = Math.round((r.duration / 60) * trafficFactor);
                }
              }
            } catch(fetchErr) {
              console.warn('OSRM road routing fallback used:', fetchErr);
            }

            results.push({
              vehicleId: veh.id,
              vehicleName: veh.name,
              vehicleColor: veh.color || (v === 0 ? '#38bdf8' : v === 1 ? '#ec4899' : '#a855f7'),
              stops: vStops,
              distance: realDistance,
              duration: realDuration,
              roadCoordinates: roadCoords
            });
          }

          setRoutesResult(results);
          setHasOptimized(true);
          if (window.confetti) window.confetti({ particleCount: 80, spread: 80 });
        } catch(err) {
          alert('เกิดข้อผิดพลาดในการคำนวณเส้นทาง: ' + err.message);
        } finally {
          setIsOptimizing(false);
        }
      };

      const handleUpdateRowBarcode = (rowId, val) => {
        const clean = (val || '').trim();
        const found = masterProducts.find(p =>
          (p.barcode && String(p.barcode).trim().toLowerCase() === clean.toLowerCase()) ||
          (p.code && String(p.code).trim().toLowerCase() === clean.toLowerCase())
        );

        setReturnSheetRows(prev => prev.map(r => {
          if (r.id !== rowId) return r;
          if (found) {
            const u = found.unitPerCarton > 0 ? found.unitPerCarton : 12;
            const w = found.weightKg || 6;
            const cbmPcs = found.cbmPerPcs || 0.000476;
            const pcs = r.qtyPcs ? Number(r.qtyPcs) : u;
            const cartons = parseFloat((pcs / u).toFixed(2));
            const cbm = (cbmPcs * pcs).toFixed(3);
            const kg = (cartons * w).toFixed(1);
            return {
              ...r,
              barcode: val,
              code: found.code || '',
              name: found.name,
              unitPerCarton: u,
              cartonSize: found.size || 'S',
              cbmPerPcs: cbmPcs,
              weightPerCarton: w,
              qtyPcs: pcs,
              qtyCartons: cartons,
              cbm: cbm,
              weightKg: kg
            };
          }
          return { ...r, barcode: val };
        }));
      };

      const handleUpdateRowQtyPcs = (rowId, val) => {
        const pcs = val === '' ? '' : Number(val);
        setReturnSheetRows(prev => prev.map(r => {
          if (r.id !== rowId) return r;
          const u = r.unitPerCarton || 12;
          const cartons = pcs === '' ? '' : parseFloat((pcs / u).toFixed(2));
          const cbm = pcs === '' ? '0.000' : ((r.cbmPerPcs || 0.000476) * pcs).toFixed(3);
          const kg = cartons === '' ? '0.0' : (cartons * (r.weightPerCarton || 6)).toFixed(1);
          return {
            ...r,
            qtyPcs: pcs,
            qtyCartons: cartons,
            cbm: cbm,
            weightKg: kg
          };
        }));
      };

      const handleUpdateRowQtyCartons = (rowId, val) => {
        const cartons = val === '' ? '' : Number(val);
        setReturnSheetRows(prev => prev.map(r => {
          if (r.id !== rowId) return r;
          const u = r.unitPerCarton || 12;
          const pcs = cartons === '' ? '' : Math.round(cartons * u);
          const cbm = pcs === '' ? '0.000' : ((r.cbmPerPcs || 0.000476) * pcs).toFixed(3);
          const kg = cartons === '' ? '0.0' : (cartons * (r.weightPerCarton || 6)).toFixed(1);
          return {
            ...r,
            qtyCartons: cartons,
            qtyPcs: pcs,
            cbm: cbm,
            weightKg: kg

        setWarehouseReturns(prev => [...newItems, ...prev]);

      const handleExportReturnsToExcel = () => {
        if (warehouseReturns.length === 0) {

          'เลขที่ใบคืน': r.docNo,
          'วันที่รับคืน': r.date,
          'เวลา': r.time,
          'บาร์โค้ด': r.barcode,
          'รหัสสินค้า': r.productCode,
          'ชื่อสินค้า': r.productName,
          'บรรจุ (ชิ้น/ลัง)': r.unitPerCarton,
          'ไซส์กล่อง': r.cartonSize,
          'จำนวนรับคืน (ชิ้น)': r.qtyPcs,
          'จำนวนรับคืน (ลัง)': r.qtyCartons,

          'น้ำหนักรวม (Kg)': r.weightKg,
          'รับคืนจาก': r.returnFrom,
          'ผู้บันทึก': r.receiver
        }));

        const ws = XLSX.utils.json_to_sheet(data);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'WarehouseReturns');
        XLSX.writeFile(wb, 'Warehouse_Returns_Report_' + new Date().toISOString().slice(0, 10) + '.xlsx');
      };

      const handleFileUploadForReturns = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (evt) => {
          try {
            const bstr = evt.target.result;
            const wb = XLSX.read(bstr, { type: 'binary' });
            const wsname = wb.SheetNames[0];
            const ws = wb.Sheets[wsname];
            const data = XLSX.utils.sheet_to_json(ws, { header: 1 });

            let pastedText = '';
            data.forEach((row, i) => {
              if (i === 0 && (String(row[0]).toLowerCase().includes('bar') || String(row[0]).toLowerCase().includes('code'))) {
                return;
              }
              if (row[0]) {
                const b = String(row[0]).trim();
                const q = row[1] ? String(row[1]).trim() : '12';
                pastedText += b + '\t' + q + '\n';
              }
            });

            if (pastedText) {
              setBatchReturnText(pastedText);
            }
          } catch(err) {
            alert('เกิดข้อผิดพลาดในการอ่านไฟล์ Excel: ' + err.message);
          }
        };
        reader.readAsBinaryString(file);
      };

                <div className="flex justify-between items-center border-b border-purple-500/30 pb-3">
                  <h3 className="font-black text-amber-300 text-base flex items-center gap-2">
                    <span className="text-xl">🏰</span>
                    แก้ไขข้อมูลคลังหลัก (Depot)
                  </h3>
                  <button onClick={() => setShowDepotModal(false)} className="p-1.5 rounded-xl hover:bg-purple-900/50 text-slate-400 hover:text-white"><i data-lucide="x" className="w-5 h-5"></i></button>
                </div>
                <div className="space-y-3 text-xs">
                  <div>
                    <label className="block text-purple-200/80 font-bold mb-1">ชื่อคลัง *</label>
                    <input type="text" value={editingDepot.name} onChange={(e) => setEditingDepot({ ...editingDepot, name: e.target.value })} className="w-full bg-slate-950 border border-purple-500/40 p-2.5 rounded-2xl font-bold" />
                  </div>
                  <div>
                    <label className="block text-purple-200/80 font-bold mb-1">ที่อยู่</label>
                    <input type="text" value={editingDepot.address} onChange={(e) => setEditingDepot({ ...editingDepot, address: e.target.value })} className="w-full bg-slate-950 border border-purple-500/40 p-2.5 rounded-2xl" />
                  </div>
                  <div className="flex justify-end gap-2 pt-3 border-t border-purple-500/30">
                    <button onClick={() => setShowDepotModal(false)} className="px-4 py-2 rounded-2xl bg-slate-950 border border-purple-500/30 font-bold text-slate-300">ยกเลิก</button>
                    <button onClick={() => {
                      setDepot(editingDepot);
                      setShowDepotModal(false);
                      setHasOptimized(false);
                    }} className="px-4 py-2 rounded-2xl bg-gradient-to-r from-purple-600 to-indigo-600 text-white font-bold shadow-md">บันทึก</button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* MODAL 8: USER & PERMISSIONS CRUD MODAL */}
          {showUserModal && editingUser && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-rose-500/40 rounded-3xl max-w-2xl w-full max-h-[90vh] flex flex-col shadow-[0_0_50px_rgba(244,63,94,0.3)] overflow-hidden text-slate-100">
                
                {/* Modal Header */}
                <div className="p-5 border-b border-rose-500/30 flex justify-between items-center bg-slate-950/80">
                  <div className="flex items-center gap-2.5">
                    <span className="text-2xl">🛡️</span>
                    <div>
                      <h3 className="font-black text-amber-300 text-base">
                        {editingUser.id && accounts.some(a => a.id === editingUser.id) ? 'แก้ไขบัญชีผู้ใช้งาน & สิทธิ์การเข้าถึง' : 'เพิ่มผู้ใช้งานใหม่ & กำหนดสิทธิ์'}
                      </h3>
                      <p className="text-[11px] text-purple-200/70">ตั้งค่า Username, Password, ตำแหน่ง และสิทธิ์การเข้าถึงแต่ละโมดูล</p>
                    </div>
                  </div>
                  <button
                    onClick={() => setShowUserModal(false)}
                    className="p-1.5 rounded-xl hover:bg-rose-950/50 text-slate-400 hover:text-white transition"
                  >
                    <i data-lucide="x" className="w-5 h-5"></i>
                  </button>
                </div>

                {/* Modal Form Body */}
                <div className="p-6 overflow-y-auto custom-scrollbar space-y-4 text-xs flex-1">
                  
                  {/* Row 1: Username & Password */}
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                      <label className="block text-amber-200/90 font-bold mb-1">
                        Username (ชื่อผู้ใช้เข้าสู่ระบบ) *
                      </label>
                      <input
                        type="text"
                        required
                        value={editingUser.username || ''}
                        onChange={(e) => setEditingUser(prev => ({ ...prev, username: e.target.value.trim() }))}
                        className="w-full bg-slate-950 border border-purple-500/40 rounded-2xl p-2.5 font-mono font-bold text-amber-300 focus:ring-2 focus:ring-amber-400"
                        placeholder="เช่น supervisor, planner2"
                      />
                    </div>

                    <div>
                      <label className="block text-amber-200/90 font-bold mb-1">
                        Password (รหัสผ่าน) *
                      </label>
                      <input
                        type="text"
                        required
                        value={editingUser.password || ''}
                        onChange={(e) => setEditingUser(prev => ({ ...prev, password: e.target.value }))}
                        className="w-full bg-slate-950 border border-purple-500/40 rounded-2xl p-2.5 font-mono font-bold text-white focus:ring-2 focus:ring-amber-400"
                        placeholder="รหัสผ่านเข้าใช้งาน..."
                      />
                    </div>
                  </div>

                  {/* Row 2: Full Name & Role */}
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                      <label className="block text-purple-200/80 font-bold mb-1">ชื่อ-นามสกุล / ชื่อเรียก:</label>
                      <input
                        type="text"
                        value={editingUser.name || ''}
                        onChange={(e) => setEditingUser(prev => ({ ...prev, name: e.target.value }))}
                        className="w-full bg-slate-950 border border-purple-500/40 rounded-2xl p-2.5 font-bold"
                        placeholder="เช่น คุณสมชาย (หัวหน้าแผนก)"
                      />
                    </div>

                    <div>
                      <label className="block text-purple-200/80 font-bold mb-1">ตำแหน่ง (Role Title):</label>
                      <input
                        type="text"
                        value={editingUser.role || ''}
                        onChange={(e) => setEditingUser(prev => ({ ...prev, role: e.target.value }))}
                        className="w-full bg-slate-950 border border-purple-500/40 rounded-2xl p-2.5 font-bold text-purple-300"
                        placeholder="เช่น ฝ่ายจัดส่ง, ผู้ดูแลระบบ, ฝ่ายคลัง"
                      />
                    </div>
                  </div>

                  {/* Row 3: Status */}
                  <div className="p-3 bg-slate-950/80 border border-purple-500/30 rounded-2xl flex items-center justify-between">
                    <div>
                      <span className="font-bold text-slate-100 block">สถานะการใช้งานบัญชี:</span>
                      <span className="text-[11px] text-purple-300/70">
                        {editingUser.status === 'suspended' ? '⛔ ระงับการใช้งาน (ไม่สามารถเข้าสู่ระบบได้)' : '✅ เปิดใช้งานปกติ (Active)'}
                      </span>
                    </div>
                    <button
                      type="button"
                      onClick={() => setEditingUser(prev => ({ ...prev, status: prev.status === 'suspended' ? 'active' : 'suspended' }))}
                      className={`px-4 py-1.5 rounded-xl font-bold text-xs border transition ${editingUser.status === 'suspended' ? 'bg-rose-950 text-rose-300 border-rose-500/50' : 'bg-emerald-950 text-emerald-300 border-emerald-500/50'}`}
                    >
                      {editingUser.status === 'suspended' ? 'สถานะ: ระงับ' : 'สถานะ: เปิดใช้งาน'}
                    </button>
                  </div>

                  {/* Row 4: PERMISSION MATRIX (CHOOSE MODULES) */}
                  <div className="space-y-2.5 pt-2 border-t border-purple-500/30">
                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
                      <label className="font-bold text-amber-300 flex items-center gap-1.5 text-xs">
                        <span>🔐 กำหนดสิทธิ์การเข้าถึงโมดูล (Module Permissions):</span>
                      </label>

                      {/* Quick Presets */}
                      <div className="flex flex-wrap gap-1.5 text-[10px]">
                        <button
                          type="button"
                          onClick={() => setEditingUser(prev => ({
                            ...prev,
                            permissions: ALL_MODULE_LIST.map(m => m.id)
                          }))}
                          className="px-2 py-0.8 bg-purple-900/60 hover:bg-purple-800 text-amber-300 border border-purple-400/40 rounded-lg font-bold"
                        >
                          ⭐ ทั้งหมด
                        </button>
                        <button
                          type="button"
                          onClick={() => setEditingUser(prev => ({
                            ...prev,
                            permissions: ['checklist', 'route', 'box_calculator', 'fleet', 'cost', 'business_idea', 'customers']
                          }))}
                          className="px-2 py-0.8 bg-indigo-900/60 hover:bg-indigo-800 text-indigo-200 border border-indigo-400/40 rounded-lg font-bold"
                        >
                          🚚 ฝ่ายจัดส่ง
                        </button>
                        <button
                          type="button"
                          onClick={() => setEditingUser(prev => ({
                            ...prev,
                            permissions: ['checklist', 'box_calculator', 'sticker']
                          }))}
                          className="px-2 py-0.8 bg-amber-900/60 hover:bg-amber-800 text-amber-200 border border-amber-400/40 rounded-lg font-bold"
                        >
                          📦 ฝ่ายคลัง
                        </button>
                        <button
                          type="button"
                          onClick={() => setEditingUser(prev => ({
                            ...prev,
                            permissions: []
                          }))}
                          className="px-2 py-0.8 bg-rose-950/60 hover:bg-rose-900 text-rose-300 border border-rose-500/40 rounded-lg font-bold"
                        >
                          ล้างสิทธิ์
                        </button>
                      </div>
                    </div>

                    {/* Permissions Grid */}
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2.5 pt-1">
                      {ALL_MODULE_LIST.map((mod) => {
                        const isChecked = (editingUser.permissions || []).includes(mod.id);

                        return (
                          <label
                            key={mod.id}
                            className={`p-2.5 rounded-2xl border flex items-center gap-2.5 cursor-pointer transition select-none ${isChecked ? 'bg-purple-950/80 border-purple-400/80 text-white shadow-[0_0_10px_rgba(168,85,247,0.3)] ring-1 ring-amber-400/40' : 'bg-slate-950/60 border-purple-900/40 text-slate-400 hover:border-purple-600/40'}`}
                          >
                            <input
                              type="checkbox"
                              checked={isChecked}
                              onChange={(e) => {
                                const currentPerms = editingUser.permissions || [];
                                if (e.target.checked) {
                                  setEditingUser(prev => ({
                                    ...prev,
                                    permissions: [...currentPerms, mod.id]
                                  }));
                                } else {
                                  setEditingUser(prev => ({
                                    ...prev,
                                    permissions: currentPerms.filter(pid => pid !== mod.id)
                                  }));
                                }
                              }}
                              className="w-4 h-4 rounded text-purple-600 focus:ring-amber-400 bg-slate-900 border-purple-500/40"
                            />
                            <div>
                              <div className="font-bold text-xs leading-tight flex items-center gap-1">
                                <span>{mod.iconEmoji || '✨'}</span>
                                <span className={isChecked ? 'text-amber-200' : 'text-slate-300'}>{mod.name}</span>
                              </div>
                              <div className="text-[10px] text-purple-300/60">{mod.desc}</div>
                            </div>
                          </label>
                        );
                      })}
                    </div>
                  </div>

                </div>

                {/* Modal Footer */}
                <div className="p-4 border-t border-rose-500/30 bg-slate-950 flex justify-between items-center">
                  <span className="text-xs text-purple-300/70 font-semibold">
                    เลือกแล้ว {(editingUser.permissions || []).length} จาก {ALL_MODULE_LIST.length} โมดูล
                  </span>
                  <div className="flex items-center gap-2">
                    <button
                      onClick={() => setShowUserModal(false)}
                      className="px-4 py-2 bg-slate-900 hover:bg-slate-800 text-slate-300 font-bold text-xs rounded-2xl border border-purple-500/30"
                    >
                      ยกเลิก
                    </button>
                    <button
                      onClick={() => handleSaveUser(editingUser)}
                      className="px-5 py-2 bg-gradient-to-r from-rose-600 via-purple-600 to-amber-500 hover:from-rose-500 hover:to-amber-400 text-slate-950 font-black text-xs rounded-2xl shadow-lg border border-amber-300/50"
                    >
                      บันทึกข้อมูลผู้ใช้งาน
                    </button>
                  </div>
                </div>

              </div>
            </div>
          )}

          {/* MODAL 9: SHAREPOINT IMPORT / SYNC DIALOG */}
          {showSharepointImportModal && (
            <div className="fixed inset-0 bg-slate-950/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-emerald-500/40 rounded-3xl max-w-2xl w-full p-6 shadow-2xl space-y-4 text-slate-100">
                <div className="flex justify-between items-center border-b border-emerald-500/30 pb-3">
                  <h3 className="font-black text-amber-300 text-base flex items-center gap-2">
                    <i data-lucide="cloud-download" className="w-5 h-5 text-emerald-400"></i>
                    นำเข้า / อัปเดตข้อมูล SharePoint Checklist PO
                  </h3>
                  <button
                    onClick={() => setShowSharepointImportModal(false)}
                    className="p-1.5 rounded-xl hover:bg-emerald-900/50 text-slate-400 hover:text-white"
                  >
                    <i data-lucide="x" className="w-5 h-5"></i>
                  </button>
                </div>

                <div className="space-y-3 text-xs">
                  <div className="p-3 bg-emerald-950/40 border border-emerald-500/30 rounded-2xl text-emerald-200 space-y-1">
                    <p className="font-bold text-amber-300">💡 วิธีการดึงข้อมูลจาก SharePoint:</p>
                    <p>1. เปิดไฟล์ SharePoint ต้นฉบับ แล้วคัดลอก (Copy) แถวข้อมูลตาราง</p>
                    <p>2. นำมาวาง (Paste) ในช่องด้านล่าง หรืออัปโหลดไฟล์ Excel / CSV</p>
                    <p>3. คอลัมน์ที่รองรับ: <strong>วันส่ง, เวลา, ลูกค้า, จำนวน PO, เลขที่ PO, IV/DS, ขนส่ง</strong></p>
                  </div>

                  <div>
                    <label className="block text-emerald-200/80 font-bold mb-1">เลือกไฟล์ Excel / CSV จาก SharePoint:</label>
                    <input
                      type="file"
                      accept=".xlsx, .xls, .csv"
                      onChange={handleSharepointFileUpload}
                      className="w-full bg-slate-950 border border-emerald-500/40 rounded-2xl p-2 text-xs text-slate-300 file:mr-3 file:py-1.5 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-emerald-600 file:text-white hover:file:bg-emerald-500"
                    />
                  </div>

                  <div>
                    <label className="block text-emerald-200/80 font-bold mb-1">หรือวางข้อความ (Paste Data):</label>
                    <textarea
                      rows="6"
                      value={sharepointImportText}
                      onChange={(e) => setSharepointImportText(e.target.value)}
                      placeholder="8/24/2026	14:00:00	WATSONS บางพลี	3	23642828	DS6908101	Rang + Jia&#10;8/24/2026	11:00:00	WATSONS ขอนแก่น	1	23642448	DS6908095	Rang + Jia"
                      className="w-full bg-slate-950 border border-emerald-500/40 rounded-2xl p-3 font-mono text-xs text-white focus:ring-2 focus:ring-amber-400 placeholder-slate-600 custom-scrollbar"
                    ></textarea>
                  </div>

                  <div className="flex items-center gap-4 bg-slate-950 p-3 rounded-2xl border border-emerald-500/20">
                    <span className="font-bold text-slate-300">รูปแบบการนำเข้า:</span>
                    <label className="flex items-center gap-1.5 cursor-pointer">
                      <input
                        type="radio"
                        name="spMode"
                        value="replace"
                        checked={sharepointImportMode === 'replace'}
                        onChange={() => setSharepointImportMode('replace')}
                        className="text-emerald-600 focus:ring-emerald-500"
                      />
                      <span>แทนที่ข้อมูลเดิมทั้งหมด (Replace)</span>
                    </label>
                    <label className="flex items-center gap-1.5 cursor-pointer">
                      <input
                        type="radio"
                        name="spMode"
                        value="append"
                        checked={sharepointImportMode === 'append'}
                        onChange={() => setSharepointImportMode('append')}
                        className="text-emerald-600 focus:ring-emerald-500"
                      />
                      <span>เพิ่มต่อท้าย (Append)</span>
                    </label>
                  </div>

                  <div className="flex justify-end gap-2 pt-3 border-t border-emerald-500/30">
                    <button
                      onClick={() => setShowSharepointImportModal(false)}
                      className="px-4 py-2 rounded-2xl bg-slate-950 hover:bg-slate-800 text-slate-300 border border-slate-700 font-bold"
                    >
                      ยกเลิก
                    </button>
                    <button
                      onClick={handleProcessSharepointImport}
                      className="px-5 py-2 rounded-2xl bg-gradient-to-r from-emerald-600 to-teal-500 hover:from-emerald-500 hover:to-teal-400 text-slate-950 font-black shadow-[0_0_15px_rgba(16,185,129,0.5)] border border-amber-300/60"
                    >
                      ⚡ ประมวลผลและอัปเดตข้อมูล
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* MODAL 8: BATCH RETURNS IMPORT MODAL */}
          {showBatchReturnModal && (
            <div className="fixed inset-0 bg-slate-950/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="w-full max-w-2xl bg-white/95 backdrop-blur-2xl rounded-3xl p-6 shadow-2xl border-2 border-teal-200 space-y-4 text-slate-800 animate-in fade-in zoom-in-95 duration-200">
                <div className="flex justify-between items-center border-b border-teal-100 pb-3">
                  <div className="flex items-center gap-2">
                    <span className="text-2xl">🔄</span>
                    <div>
                      <h3 className="font-black text-sm text-slate-900">นำเข้ารายการรับคืนสินค้าจำนวนมาก (Batch / Excel)</h3>
                      <p className="text-[10px] text-teal-700">อัปโหลดไฟล์ Excel หรือวางบาร์โค้ด + จำนวนชิ้นรับคืน</p>
                    </div>
                  </div>
                  <button
                    onClick={() => setShowBatchReturnModal(false)}
                    className="p-1 rounded-xl text-slate-400 hover:text-slate-600 hover:bg-slate-100 transition"
                  >
                    <i data-lucide="x" className="w-5 h-5"></i>
                  </button>
                </div>

                <div className="space-y-3 text-xs">
                  <div className="p-3 bg-teal-50 rounded-2xl border border-teal-200 text-[11px] text-teal-900 space-y-1">
                    <p className="font-bold">📋 คำแนะนำการนำเข้า:</p>
                    <p>• วางข้อมูลในรูปแบบ: <strong>บาร์โค้ด [Tab หรือ เว้นวรรค] จำนวนชิ้น</strong></p>
                    <p>• ระบบจะดึงชื่อสินค้าจาก Master Data 631 สินค้า และคำนวณจำนวนกล่อง/ลังให้อัตโนมัติ</p>
                  </div>

                  <div>
                    <label className="block text-slate-700 font-bold mb-1">เลือกไฟล์ Excel (.xlsx / .csv):</label>
                    <input
                      type="file"
                      accept=".xlsx, .xls, .csv"
                      onChange={handleFileUploadForReturns}
                      className="w-full bg-slate-50 border border-slate-200 rounded-2xl p-2 text-xs text-slate-700 file:mr-3 file:py-1.5 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-teal-600 file:text-white hover:file:bg-teal-500"
                    />
                  </div>

                  <div>
                    <label className="block text-slate-700 font-bold mb-1">หรือวางข้อความ (Paste Data):</label>
                    <textarea
                      rows="6"
                      value={batchReturnText}
                      onChange={(e) => setBatchReturnText(e.target.value)}
                      placeholder="8850029011122	24	ชำรุดเสียหายจากการขนส่ง	DC บางพลี&#10;8850029012345	12	สินค้าใกล้หมดอายุ	ร้านค้า TT นครปฐม"
                      className="w-full bg-slate-50 border border-slate-200 rounded-2xl p-3 font-mono text-xs text-slate-900 focus:ring-2 focus:ring-teal-400 placeholder-slate-400 custom-scrollbar"
                    ></textarea>
                  </div>
                </div>

                <div className="flex justify-end gap-2 pt-3 border-t border-teal-100">
                  <button
                    onClick={() => setShowBatchReturnModal(false)}
                    className="px-4 py-2 rounded-2xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs"
                  >
                    ยกเลิก
                  </button>
                  <button
                    onClick={handleProcessBatchReturns}
                    className="px-5 py-2 rounded-2xl bg-gradient-to-r from-teal-500 to-emerald-500 hover:from-teal-400 hover:to-emerald-400 text-white font-black text-xs shadow-md border border-white"
                  >
                    ⚡ ประมวลผลและเพิ่มรายการรับคืน
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }


    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
